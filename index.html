<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Theo dõi giải">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Phần mềm theo dõi giải đấu</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      /* Tránh zoom trên iOS */
      -webkit-text-size-adjust: 100%;
    }
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .app-logo {
      width: 72px; height: 72px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      object-fit: cover;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      /* Giúp nội dung trong iframe không bị “to” bất thường */
      transform-origin: top left;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải dữ liệu...</div>
  </div>

  <iframe
    id="app-iframe"
    src="https://script.google.com/macros/s/AKfycbxa7x8kJ2EQNtowUATYqxGwsnwO4ezBwCbYXeZgp5fCFBMKnp2P6K_JybupSk4K4CT-/exec"
    allow="fullscreen"
    loading="eager"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('hidden');
    }
    // Fallback nếu iframe load chậm
    setTimeout(hideLoader, 10000);
  </script>
</body>
</html>
